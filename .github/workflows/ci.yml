name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  INSPECTCODE_VERSION: '2026.2.1'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  code-style-and-quality:
    name: Code Style & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup .NET runtime for InspectCode
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build with analyzers
        run: dotnet build --no-restore --configuration Release /warnaserror

      - name: Install JetBrains InspectCode
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools --version ${{ env.INSPECTCODE_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run JetBrains InspectCode
        run: |
          mkdir -p artifacts
          jb inspectcode g0v0.Server.Common.sln --no-build --no-updates --severity=WARNING --output=artifacts/inspectcode.sarif
          warnings=$(jq '[.runs[].results[] | select(.level == "warning" or .level == "error")] | length' artifacts/inspectcode.sarif)
          echo "InspectCode warning/error count: $warnings"
          jq -r '.runs[].results[] | select(.level == "warning" or .level == "error") | [ .level, .ruleId, (.locations[0].physicalLocation.artifactLocation.uri // ""), (.locations[0].physicalLocation.region.startLine // 0), .message.text ] | @tsv' artifacts/inspectcode.sarif
          test "$warnings" -eq 0

      - name: Upload InspectCode report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jetbrains-inspectcode-common
          path: artifacts/inspectcode.sarif
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 30

