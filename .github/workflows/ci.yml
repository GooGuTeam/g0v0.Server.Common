name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  INSPECTCODE_VERSION: '2026.2.1'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-warnaserror:
    name: Build (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build with analyzers
        run: dotnet build --no-restore --configuration Release /warnaserror

  inspectcode:
    name: JetBrains InspectCode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET runtime for InspectCode
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (for InspectCode analysis)
        run: dotnet build --no-restore --configuration Release

      - name: Install JetBrains InspectCode
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools --version ${{ env.INSPECTCODE_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run JetBrains InspectCode
        run: |
          mkdir -p artifacts
          jb inspectcode g0v0.Server.Common.sln --no-build --no-updates --severity=WARNING --swea --output=artifacts/inspectcode.sarif
          warnings=$(jq '[.runs[].results[] | select(.level == "warning" or .level == "error")] | length' artifacts/inspectcode.sarif)
          echo "InspectCode warning/error count: $warnings"
          jq -r '.runs[].results[] | select(.level == "warning" or .level == "error") | [ .level, .ruleId, (.locations[0].physicalLocation.artifactLocation.uri // ""), (.locations[0].physicalLocation.region.startLine // 0), .message.text ] | @tsv' artifacts/inspectcode.sarif
          test "$warnings" -eq 0

      - name: Upload InspectCode report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jetbrains-inspectcode-common
          path: artifacts/inspectcode.sarif
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Download latest GeoIP databases
        shell: bash
        run: |
          mkdir -p geoip
          cd geoip
          for edition in Country ASN; do
            file="GeoLite2-${edition}.mmdb"
            base_url="https://raw.githubusercontent.com/Loyalsoldier/geoip/release"
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --output "$file" "$base_url/$file"
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --output "$file.sha256sum" "$base_url/$file.sha256sum"
            sha256sum --check "$file.sha256sum"
          done

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Run explicit GeoIP tests
        env:
          G0V0_GEOIP_TEST_DATABASE_DIRECTORY: ${{ github.workspace }}/geoip
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~GeoIPServiceTests" --logger "trx;LogFileName=geoip-test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 30

